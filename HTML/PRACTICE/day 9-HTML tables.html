<!DOCTYPE html>
<html>

<head>
    <title>Day 9-HTML table</title>
</head>

<body>
    <h1>student marks</h1>
    <table border="1">
        <tr>
            <td>name</td>
            <td>maths</td>
            <td>science</td>
            <td>total</td>
        </tr>
        <tr>
            <td>yathin</td>
            <td>99</td>
            <td>95</td>
            <td>194</td>
        </tr>
        <tr>
            <td>ullas</td>
            <td>84</td>
            <td>90</td>
            <td>176</td>
        </tr>
    </table>
    <br>
    <h1>merging colomns with colspan</h1>
    <table border="1">
        <tr>
            <th>name</th>
            <th colspan="2">marks</th>
        </tr>
        <tr>
            <td>yathin</td>
            <td>196</td>
        </tr>
        <tr>
            <td>ullas</td>
            <td>186</td>
        </tr>
    </table>
    <br>
    <h1>merging rows with rowspan</h1>
    <table border="1">
        <tr>
            <th>department</th>
            <th>employee</th>
        </tr>
        <tr>
            <td rowspan="2">HR</td>
            <td>yathin</td>
        </tr>
        <tr>
            <td>ullas</td>
        </tr>
        <tr>
            <td>it</td>
            <td>damodhar</td>
        </tr>
    </table>
</body>

</html>
