<!DOCTYPE html>
<html>

<head>
    <title>Day 13-HTML Forms Part 2</title>
</head>

<body>
    <h1>Day 13-HTML Forms Part 2</h1>
    <form action="">
        <label for="your name">your name:
            <input type="text" id="your name" name="your name" placeholder="enter your name">
        </label>
        <br><br>
        <label>gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label>
        <br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">other</label>
        <br><br>
        <label>hobbies:</label>
        <br>
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">reading</label>
        <br>
        <input type="checkbox" id="sports" name="hobbies" value="sports">
        <label for="sports">sports</label>
        <br>
        <input type="checkbox" id="music" name="hobbies" value="music">
        <label for="music">music</label>
        <br><br>
        <label for="country">country:</label>
        <select id="country" name="country">
            <option value="india">india</option>
            <option value="usa">usa</option>
            <option value="uk">uk</option>
            <option value="canada">canada</option>
        </select>
        <br><br>
        <label for="message">message:</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="50" placeholder="enter your message"></textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
