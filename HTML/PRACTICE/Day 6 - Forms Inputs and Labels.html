<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 6 - Forms Inputs and Labels</title>
</head>

<body>
    <h1>Forms Inputs and Labels</h1>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter your age"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="Enter your date of birth"><br><br>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select><br><br>

        <label for="rollno">Roll No:</label>
        <input type="text" id="rollno" name="rollno" value="12345" readonly><br><br>

        <label for="dept">Department:</label>
        <input type="text" id="dept" name="dept" value="Computer Science" disabled><br><br>

        <label>
            phonenumber:
            <input type="tel" name="phonenumber" placeholder="7034556789">
        </label>

    </form>
</body>

</html>
