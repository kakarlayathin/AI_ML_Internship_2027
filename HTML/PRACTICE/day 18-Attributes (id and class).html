<!DOCTYPE html>
<html lang="en">

<head>
    <title>day 18-Attributes(id and class)</title>
    <style>
        .highlight {
            color: red;
            font-weight: bold;
        }

        .blue-text {
            color: blue;
        }

        .box {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightgreen;
        }

        #main-title {
            font-size: 24px;
            text-align: center;
            color: darkred;
        }

        #special-paragraph {
            font-style: italic;
            color: darkblue;
        }
    </style>
</head>

<body>
    <h1 id="main-title">welcome to my website</h1>
    <p class="highlight">this is the highlighted paragraph</p>
    <p id="special-paragraph">this is the special paragraph</p>
    <p class="blue-text">this is a blue paragraph</p>
    <div class="box">
        <h3>box 1</h3>
        <p>this is the content of box 1 it uses the box class</p>
    </div>
    <div class="box">
        <h3>box 2</h3>
        <p>this is the content of box 2 it also uses the box class</p>
    </div>
</body>

</html>
