<!DOCTYPE html>
<html>

<head>
    <title>Day 4b - Images</title>
</head>

<body>
    <h1>Types of images</h1>
    <h2>1. External image</h2>
    <p><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHTYryzYuoTs_l5pzuIn7RdnDcZer8IsKpb9N49RxuDMw6dbECIIaRqXCEuQKnYOjbf1L1xkRaHIDhuw2y6sJYnhbbkKVCF3fo54qg_4tAbg&s=10"
            alt="this is tiger"></p>
    <h2>2. Image with fixed size</h2>
    <p><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHTYryzYuoTs_l5pzuIn7RdnDcZer8IsKpb9N49RxuDMw6dbECIIaRqXCEuQKnYOjbf1L1xkRaHIDhuw2y6sJYnhbbkKVCF3fo54qg_4tAbg&s=10"
            alt="this is tiger" width="200" height="200"></p>
    <h2>3. Image with tooltip</h2>
    <p><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHTYryzYuoTs_l5pzuIn7RdnDcZer8IsKpb9N49RxuDMw6dbECIIaRqXCEuQKnYOjbf1L1xkRaHIDhuw2y6sJYnhbbkKVCF3fo54qg_4tAbg&s=10"
            alt="this is tiger" title="this is tiger image"></p>
    <h2>4. Image with link</h2>
    <p><a href="https://www.google.com">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHTYryzYuoTs_l5pzuIn7RdnDcZer8IsKpb9N49RxuDMw6dbECIIaRqXCEuQKnYOjbf1L1xkRaHIDhuw2y6sJYnhbbkKVCF3fo54qg_4tAbg&s=10"
                alt="this is tiger"></a>
    </p>
    <h2>5. Broken image</h2>
    <p><img src="https://example.com/nonexistent.jpg" alt="this is a broken image"></p>

</body>

</html>
