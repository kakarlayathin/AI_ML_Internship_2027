<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8 - Form Submission and GET vs POST</title>
</head>

<body>
    <h1>get form</h1>
    <form action="/submit" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="Enter your username"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    <hr>

    <h1>post form</h1>
    <form action="/submit" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="Enter your username"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    <hr>

    <h1>file upload</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="file">Choose a file to upload:</label>
        <input type="file" id="file" name="file" required>
        <br><br>
        <input type="submit" value="Upload">
    </form>
    <hr>

    <h1>submit to new tab</h1>
    <form action="https://google.com/search" target="_blank" method="get">
        <label for="q">Search:</label>
        <input type="text" id="q" name="q" placeholder="Search google...">
        <button type="submit">Go to new Tab</button>
    </form>

</body>

</html>
